<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audio Player</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Aadhi Aadhi - Audio Player</h1>
      <p class="sub">Static version for GitHub Pages.</p>

      <div class="card">
        <label for="code">Access Code (client-side only)</label>
        <input id="code" type="password" placeholder="Enter access code" />
        <button id="unlock">Unlock Player</button>
        <p id="status" role="status" aria-live="polite"></p>
      </div>

      <section id="player-panel" class="card hidden">
        <audio id="player" controls preload="metadata">
          <source src="./Aadhi Aadhi_FINAL_MASTER_48Khz_16BIt_07_.wav" type="audio/wav" />
          Your browser does not support audio playback.
        </audio>
      </section>
    </main>

    <script src="./app.js" defer></script>
  </body>
  </html>
