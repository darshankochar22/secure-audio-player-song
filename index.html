<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aadhi Aadhi | Song Player</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="player-shell">
        <header class="topbar">
          <p class="brand">Song Player</p>
          <span class="badge">Static Edition</span>
        </header>

        <div class="cover-wrap">
          <div class="cover-art" aria-hidden="true">
            <div class="vinyl"></div>
          </div>
          <div class="meta">
            <h1>Aadhi Aadhi</h1>
            <p class="artist">Master Mix - 48Khz / 16Bit</p>
            <p class="desc">A clean, minimal player experience for your track.</p>
          </div>
        </div>

        <section class="unlock card">
          <label for="code">Access Code</label>
          <div class="unlock-row">
            <input id="code" type="password" placeholder="Enter access code" />
            <button id="unlock" type="button">Unlock</button>
          </div>
          <p id="status" role="status" aria-live="polite"></p>
        </section>

        <section id="player-panel" class="card hidden">
          <audio id="player" controls preload="metadata">
            <source src="./Aadhi Aadhi_FINAL_MASTER_48Khz_16BIt_07_.wav" type="audio/wav" />
            Your browser does not support audio playback.
          </audio>
        </section>
      </section>
    </main>

    <script src="./app.js" defer></script>
  </body>
</html>
