<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secure Audio Player</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Secure Audio Player</h1>
      <p class="sub">Enter access code to unlock playback.</p>

      <form id="login-form" class="card">
        <label for="code">Access Code</label>
        <input id="code" name="code" type="password" required autocomplete="off" />
        <button type="submit">Unlock</button>
      </form>

      <section id="player-panel" class="card hidden">
        <audio id="player" controls preload="metadata" src="/api/audio"></audio>
        <div class="actions">
          <button id="logout" type="button">Lock</button>
        </div>
      </section>

      <p id="status" role="status" aria-live="polite"></p>
    </main>

    <script src="/app.js" defer></script>
  </body>
  </html>
